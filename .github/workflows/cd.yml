name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check package version
        id: package-version
        run: |
          PACKAGE_NAME=$(npm pkg get name --workspaces=false | tr -d '"')
          PACKAGE_VERSION=$(npm pkg get version --workspaces=false | tr -d '"')

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Package $PACKAGE_NAME@$PACKAGE_VERSION is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package $PACKAGE_NAME@$PACKAGE_VERSION is not published yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.package-version.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
